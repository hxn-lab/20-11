@font-face {
    font-family: 'Pacifico';
    src: url('./assets/bouquet/Pacifico-Regular.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: swap;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    overflow: hidden !important;
    overflow-x: hidden !important;
    overflow-y: hidden !important;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
}

body {
    font-family: 'Dancing Script', 'Pacifico', cursive;
    background: #f5c6d4 url('assets/images/background.jpg') center center / cover no-repeat;
    min-height: 100vh;
    max-height: 100vh;
    overflow: hidden !important;
    overflow-x: hidden !important;
    overflow-y: hidden !important;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    position: relative;
    margin: 0;
    padding: 0;
}

/* Decorative corners */
.corner-decor {
    position: fixed;
    z-index: 5;
    max-width: 30vw;
    max-height: 44vh;
    pointer-events: none;
}

.corner-decor img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: right bottom;
}

.bottom-left img {
    transform: scaleX(-1);
}

.top-left { top: 0; left: 0; width: 400px; height: 400px; }
.top-right { top: 0; right: 0; width: 400px; height: 400px; }
.bottom-left { bottom: 0; left: 0; width: 380px; height: 380px; }
.bottom-right { bottom: 0; right: 0; width: 380px; height: 380px; }

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
}

.top-center-decor {
    position: fixed;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
}

.top-center-decor svg {
    width: 150px;
    height: 80px;
}


/* Floral decorations */
.floral-top-left {
    position: fixed;
    top: 0px;
    left: 0px;
    z-index: 5;
}

.floral-top-right {
    position: fixed;
    top: 0px;
    right: 0px;
    z-index: 5;
}

.floral-top-left,
.floral-top-right {
    pointer-events: none;
}

.floral-img {
    display: block;
    width: 180px;
    height: 180px;
    object-fit: contain;
}

.floral-top-left .floral-img {
    transform: scaleX(-1);
}

/* Desktop - phóng to floral */
@media (min-width: 1024px) {
    .floral-img {
        width: 250px !important;
        height: 250px !important;
    }
}

.teacherday-image {
    width: 280px;
    height: 140px;
    object-fit: contain;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
    /* Tắt animation cho logo 20/11 */
}

@keyframes teacherdayFloat {
    0%, 100% {
        transform: translateY(0) scale(1);
    }
    50% {
        transform: translateY(-5px) scale(1.05);
    }
}

.container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    max-height: 100vh;
    position: relative;
    z-index: 2;
    padding: 20px;
    width: 100vw;
    max-width: 100vw;
    box-sizing: border-box;
    overflow: hidden;
}

/* Cute Pink Board - Enhanced Design with Multiple Frames */
.cute-board {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 20px auto;
    min-height: 300px;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    max-width: calc(100vw - 40px);
}

/* Viền khung ngoài cùng - mềm mại và sang trọng */
.outer-frame {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #fce4ec 100%);
    border-radius: 25px;
    box-shadow:
        0 20px 40px rgba(255, 105, 180, 0.3),
        0 10px 20px rgba(255, 105, 180, 0.2),
        inset 0 2px 4px rgba(255,255,255,0.8),
        inset 0 -2px 4px rgba(255, 192, 203, 0.3);
    z-index: 1;
}

/* Viền khung giữa */
.middle-frame {
    position: absolute;
    inset: 8px;
    background: linear-gradient(135deg, #f8bbd0 0%, #f48fb1 50%, #f8bbd0 100%);
    border-radius: 20px;
    box-shadow:
        inset 0 2px 5px rgba(255,105,180,0.2),
        inset 0 -2px 5px rgba(255,255,255,0.4),
        0 0 0 1px rgba(255,255,255,0.3);
    z-index: 2;
}

/* Viền khung trong */
.inner-frame {
    position: absolute;
    inset: 16px;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #fce4ec 100%);
    border-radius: 16px;
    box-shadow:
        inset 0 1px 3px rgba(255,105,180,0.15),
        inset 0 -1px 3px rgba(255,255,255,0.5);
    z-index: 3;
}

/* Bề mặt bảng hồng nhạt - dễ viết chữ */
.board-surface {
    position: absolute;
    inset: 24px;
    background: linear-gradient(135deg, #ffeef5 0%, #ffd6e7 30%, #ffeef5 60%, #ffe0ec 100%);
    border-radius: 12px;
    box-shadow:
        inset 0 3px 10px rgba(255,182,193,0.2),
        inset 0 0 100px rgba(255,240,245,0.3),
        inset 0 -2px 5px rgba(255,192,203,0.15);
    overflow: hidden;
    /* Tắt hiệu ứng pulse của bảng */
    z-index: 4;
    padding: 40px 50px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Texture bảng mịn hơn */
.board-texture {
    position: absolute;
    inset: 0;
    background-image:
        repeating-linear-gradient(
            90deg,
            transparent,
            transparent 3px,
            rgba(255,255,255,0.02) 3px,
            rgba(255,255,255,0.02) 6px
        ),
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(255,255,255,0.02) 3px,
            rgba(255,255,255,0.02) 6px
        );
    opacity: 0.4;
    z-index: 5;
    pointer-events: none;
}

/* Hiệu ứng lấp lánh nhẹ */
.board-surface::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
    /* Tắt hiệu ứng shimmer của bảng */
    z-index: 6;
    pointer-events: none;
}

@keyframes shimmer {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
}

@keyframes boardGlow {
    0%, 100% {
        opacity: 0.6;
        transform: scale(1);
    }
    50% {
        opacity: 0.8;
        transform: scale(1.02);
    }
}

/* Board Decorations */
.board-decoration {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 1;
}

.board-corner {
    position: absolute;
    font-size: 24px;
    /* Tắt animation cho icon góc */
}

.love-icon {
    width: 45px;
    height: 45px;
    object-fit: contain;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
}

/* Love Button Styles */
.love-button-container {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translate(-50%, 50%);
    z-index: 10;
    text-align: center;
    animation: buttonFadeIn 1s ease-out;
    width: max-content;
    max-width: calc(100% - 48px);
}


.love-button {
    background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #ffb3d6 100%);
    border: none;
    border-radius: 50px;
    padding: 18px 36px;
    font-family: 'Pacifico', cursive;
    font-size: 1.35rem;
    font-weight: 400;
    line-height: 1.35;
    color: white;
    cursor: pointer;
    box-shadow:
        0 8px 20px rgba(255, 107, 157, 0.4),
        0 4px 10px rgba(255, 107, 157, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 auto;
}

.love-button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow:
        0 12px 25px rgba(255, 107, 157, 0.5),
        0 6px 15px rgba(255, 107, 157, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.4);
}

.love-button:active {
    transform: translateY(-1px) scale(1.02);
}

.button-text {
    position: relative;
    z-index: 2;
}

.button-heart {
    font-size: 1.2rem;
    animation: heartBeat 1.5s ease-in-out infinite;
}

@keyframes buttonFadeIn {
    0% {
        opacity: 0;
        transform: translate(-50%, calc(50% + 20px)) scale(0.8);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(1);
    }
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.2);
    }
}

@keyframes messageFadeIn {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes messageFadeOut {
    0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
    }
}

.top-left-corner {
    top: 15px;
    left: 15px;
    animation-delay: 0s;
}

.top-right-corner {
    top: 15px;
    right: 15px;
    animation-delay: 1s;
}

.bottom-left-corner {
    bottom: 15px;
    left: 15px;
    animation-delay: 2s;
}

.bottom-right-corner {
    bottom: 15px;
    right: 15px;
    animation-delay: 3s;
}

@keyframes cornerFloat {
    0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
    }
    50% {
        transform: translateY(-5px) rotate(5deg) scale(1.1);
    }
}

.side-decoration {
    position: absolute;
    top: 11%;
    height: 70%;
    width: clamp(18px, 2.4vw, 32px);
    pointer-events: none;
}

.board-silk-sparkle {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    opacity: .95;
}

.right-side .board-silk-sparkle { transform: scaleX(-1); }

.side-decoration::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(8px, 1vw, 12px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #fffefa, #ffe6bf);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
}

.left-side {
    left: 10px;
}

.right-side {
    right: 10px;
}

.deco-item {
    font-size: 18px;
    /* Tắt animation cho icon bên cạnh */
}

.deco-item:nth-child(1) { animation-delay: 0s; }
.deco-item:nth-child(2) { animation-delay: 1s; }
.deco-item:nth-child(3) { animation-delay: 2s; }

@keyframes sideFloat {
    0%, 100% {
        transform: translateX(0) scale(1);
        opacity: 0.7;
    }
    50% {
        transform: translateX(5px) scale(1.2);
        opacity: 1;
    }
}

.text-container {
    position: relative;
    z-index: 7;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    text-align: center;
}

.board-heart-ribbon {
    display: block;
    width: clamp(76px, 11vw, 136px);
    height: auto;
    pointer-events: none;
    user-select: none;
}

.top-right-corner .board-heart-ribbon {
    transform: scaleX(-1);
}

.handwriting-text {
    font-size: clamp(2.5rem, 6.5vw, 4rem);
    color: #d91e5c;
    font-weight: 700;
    line-height: 1.3;
    display: inline-block;
}

.text-line {
    display: block;
    margin: 15px 0;
    position: relative;
}

.handwriting-ink {
    position: relative;
    display: inline-block;
    padding: .12em .16em;
    white-space: pre;
    clip-path: inset(0 100% 0 0);
    vertical-align: middle;
    text-shadow: 0 0 7px #f487b040;
}

.handwriting-glow {
    position: absolute;
    inset: 0;
    padding: inherit;
    box-sizing: border-box;
    pointer-events: none;
    color: #ed6097;
    text-shadow: 0 0 4px #ed79a566, 0 0 8px #ed79a540;
    opacity: 0;
    transition: opacity .45s ease-out;
    -webkit-mask-image: linear-gradient(to right, transparent calc(var(--write-x, 0px) - var(--glow-span, 60px)), #000 calc(var(--write-x, 0px) - 12px), #000 var(--write-x, 0px), transparent calc(var(--write-x, 0px) + 10px));
    mask-image: linear-gradient(to right, transparent calc(var(--write-x, 0px) - var(--glow-span, 60px)), #000 calc(var(--write-x, 0px) - 12px), #000 var(--write-x, 0px), transparent calc(var(--write-x, 0px) + 10px));
}
@media (prefers-reduced-motion: reduce) {
    .handwriting-glow { display: none; }
}

.pen-cursor {
    position: fixed;
    left: 0; top: 0;
    width: 35px; height: 35px;
    pointer-events: none;
    z-index: 1000;
    opacity: 0;
    transform-origin: 5px 30px;
    filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.25));
    transition: opacity 0.3s;
}

.pen-cursor.active {
    opacity: 1;
    will-change: transform;
}



/* MỰC SÁT CHÂN CHỮ - ĐÃ TỐI ƯU TỪNG PIXEL */
.ink-trail {
    position: fixed;
    width: 3.5px; height: 3.5px;
    background: radial-gradient(circle, #d91e5c 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    animation: fadeInk 0.8s ease-out forwards;
}

@keyframes fadeInk {
    0% { opacity: 0.9; transform: scale(1); }
    100% { opacity: 0; transform: scale(2.2); }
}

.date {
    font-size: 1.3em;
    color: #ff1167;
    font-family: 'Pacifico', cursive;
}

/* ===== RESPONSIVE DESIGN ===== */

/* Đảm bảo thông báo xoay ngang chỉ hiển thị trên mobile/tablet */
.rotate-notice {
    display: none;
}

/* Large Desktop (1200px+) - Default styles already defined above */
@media (min-width: 1200px) {
    .cute-board {
        max-width: 860px;
        aspect-ratio: 1.72;
    }
    .board-surface {
        padding: 40px 60px;
    }
    .handwriting-text { font-size: 3.75rem; }
    .teacherday-image {
        width: 320px;
        height: 160px;
    }
}

/* Desktop lớn (1025px+) - Đảm bảo không hiển thị thông báo xoay ngang */
@media (min-width: 1025px) {
    .rotate-notice {
        display: none !important;
    }
}

/* Desktop & Laptop (1025px - 1199px) */
@media (min-width: 1025px) and (max-width: 1199px) {
    .corner-decor {
        width: 350px !important;
        height: 350px !important;
    }
    .top-center-decor {
        top: 5px;
    }
    .top-center-decor svg {
        width: 120px;
        height: 70px;
    }
    .teacherday-image {
        width: 220px;
        height: 110px;
    }
    .handwriting-text {
        font-size: clamp(2rem, 5vw, 3rem);
    }
    .cute-board {
        max-width: 900px;
    }
    .board-surface {
        padding: 50px 60px;
    }
}

/* Tablet Landscape (768px - 991px) */
@media (max-width: 991px) {
    .corner-decor {
        width: 280px !important;
        height: 280px !important;
    }
    .top-center-decor {
        top: 5px;
    }
    .top-center-decor svg {
        width: 100px;
        height: 60px;
    }
    .teacherday-image {
        width: 180px;
        height: 90px;
    }
    .handwriting-text {
        font-size: clamp(1.8rem, 4.5vw, 2.5rem);
    }
    .letter {
        margin: 0 1px;
    }
    .container {
        padding: 15px;
    }
}

/* Mobile/Tablet Landscape (768px - 1368px) */
@media (min-width: 768px) and (max-width: 1368px) and (orientation: landscape) {
    .top-center-decor {
        top: 0px;
    }
    .cute-board {
        min-height: 60px !important;
        max-width: 70%;
        aspect-ratio: none !important;
    }
    .board-surface {
        padding: 4px 12px 16px;
    }

    /* Button responsive cho tablet landscape */
    .love-button {
        padding: 11px 24px;
        font-size: 1.2rem;
    }

    .button-text {
        font-size: 1.1rem;
    }

    .button-heart {
        font-size: 1rem;
    }

}



/* Mobile và Tablet Portrait (<=1024px) - CHỈ HIỂN THỊ THÔNG BÁO XOAY NGANG */
@media (max-width: 1024px) and (orientation: portrait) {
    .rotate-notice {
        display: flex !important;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at 50% 35%, #fffafc 0%, #fce7ee 55%, #f5cbd9 100%);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Segoe UI', sans-serif;
        padding: 28px;
        box-sizing: border-box;
    }

    .rotate-notice__icon {
        width: 112px;
        height: 112px;
        margin-bottom: 24px;
        color: #cc6588;
        border: 1px solid #ffffffc9;
        border-radius: 30px;
        background: #fff9fc99;
        box-shadow: 0 12px 36px #b05c7e12;
    }

    .rotate-notice h2 {
        color: #8c405d;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -.4px;
        margin: 0 0 10px;
        text-align: center;
    }

    .rotate-notice p {
        color: #a16d80;
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
        margin: 0;
    }

    .container {
        display: none;
    }
}

/* Mobile và Tablet Landscape (<=1023px) */
@media (max-width: 1023px) and (orientation: landscape) {
    .rotate-notice {
        display: none;
    }

    .corner-decor {
        width: 200px !important;
        height: 200px !important;
    }
    .top-center-decor {
        top: 0px;
    }
    .top-center-decor svg {
        width: 80px;
        height: 50px;
    }
    .teacherday-image {
        width: 80px;
        height: 50px;
    }
    .handwriting-text {
        font-size: clamp(1.5rem, 4vw, 2rem);
    }
    .container {
        padding: 10px;
    }
    .cute-board {
        min-height: 80px;
        max-width: 90%;
    }
    .board-surface {
        padding: 8px 12px 16px;
    }

    /* Button responsive cho mobile landscape */
    .love-button {
        padding: 9px 22px;
        font-size: 1.1rem;
    }

    .button-text {
        font-size: 1rem;
    }

    .button-heart {
        font-size: 0.9rem;
    }

}

/* Tablet Landscape lớn (1024px - 1368px) - Chỉ áp dụng cho tablet, không phải desktop */
@media (min-width: 1024px) and (max-width: 1368px) and (orientation: landscape) {
    /* Chỉ áp dụng cho tablet, không override desktop */
}

/* Mobile Landscape nhỏ (640px - 667px) */
@media (min-width: 640px) and (max-width: 667px) and (orientation: landscape) {
    .love-button {
        padding: 8px 19px;

    padding: 0 8px;
    width: 100%;
    max-width: min(92vw, 1150px);
    line-height: 1.25;
    word-break: break-word;
    text-align: center;
    letter-spacing: 0.02em;
    background-image: radial-gradient(circle at center, #ffffff 1px, #e0f2fe 1.15px, transparent 1.2px);
    background-size: 2.9px 2.9px;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: none;
    animation: introTextReveal 2.2s ease-out both;
    filter: drop-shadow(0 0 1.8px rgba(255, 255, 255, 1)) drop-shadow(0 0 7px rgba(186, 230, 253, 0.95)) drop-shadow(0 0 18px rgba(56, 189, 248, 0.8)) drop-shadow(0 0 32px rgba(14, 165, 233, 0.5));
  }

  @keyframes introTextReveal {
    0% {
      opacity: 0;
      transform: scale(0.92);
    }
    35% {
      opacity: 0.25;
      transform: scale(0.98);
    }
    65% {
      opacity: 0.6;
      transform: scale(1.01);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  .night {
    position: absolute;
    inset: 0;
    background: #17395d url('./assets/lossless/background-2011.778613dae775c78a.webp') center / cover no-repeat;
    pointer-events: none;
    z-index: 0;
  }
  /* === HẠT BỤI VÀNG HOÀNG KIM BAY LƠ LỬNG (GOLDEN STARDUST PARTICLES) === */
  .particles {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100vw;
    height: var(--app-h);
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    bottom: -15px;
    width: 0.7vmin;
    height: 0.7vmin;
    border-radius: 50%;
    /* Gradient tâm sáng trắng ấm tỏa sang vàng hoàng kim hổ phách 3D */
    background: radial-gradient(circle at 35% 35%, #ffffff 12%, #fef08a 38%, #facc15 70%, #ca8a04 100%);
    /* Hào quang vàng kim hoàng gia phát sáng lung linh */
    box-shadow:
      0 0 5px #ffffff,
      0 0 10px #facc15,
      0 0 20px rgba(234, 179, 8, 0.75),
      0 0 32px rgba(202, 138, 4, 0.4);
    mix-blend-mode: screen;
    animation: particle-up-gold linear infinite;
  }
  @keyframes particle-up-gold {
    0% {
      transform: translateY(0) translateX(0) scale(0.5);
      opacity: 0;
    }
    12% {
      opacity: 0.9;
      transform: translateY(-12vh) translateX(6px) scale(1.1);
    }
    35% {
      opacity: 0.85;
      transform: translateY(-35vh) translateX(-8px) scale(0.95);
    }
    60% {
      opacity: 0.95;
      transform: translateY(-60vh) translateX(10px) scale(1.15);
    }
    85% {
      opacity: 0.75;
      transform: translateY(-85vh) translateX(-5px) scale(0.9);
    }
    100% {
      transform: translateY(-108vh) translateX(4px) scale(0.4);
      opacity: 0;
    }
  }

  .shooting-stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .shooting-star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.8);
    opacity: 0;
    animation: shootingStar 6s linear infinite;
  }

  .shooting-star::before {
    content: '';
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 100%);
    animation: shootingStarTail 6s linear infinite;
  }

  .shooting-star:nth-child(1) {
    top: 10%;
    left: -10%;
    animation-delay: 0s;
    animation-duration: 5.5s;
  }

  .shooting-star:nth-child(2) {
    top: 25%;
    left: -10%;
    animation-delay: 4s;
    animation-duration: 6s;
  }

  .shooting-star:nth-child(3) {
    top: 40%;
    left: -10%;
    animation-delay: 8s;
    animation-duration: 5.8s;
  }

  @keyframes shootingStar {
    0% {
      opacity: 0;
      transform: translateX(0) translateY(0) rotate(45deg);
    }
    10% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translateX(120vw) translateY(50vh) rotate(10deg);
    }
  }

  @keyframes shootingStarTail {
    0% {
      width: 0;
    }
    30% {
      width: 100px;
    }
    100% {
      width: 0;
    }
  }

  .flowers {
    position: relative;
    transform: scale(0.7) translateY(-4.5vmin);
    z-index: 2;
    will-change: transform;
  }

  .flower {
    position: absolute;
    bottom: 31vmin;
    transform-origin: bottom center;
    z-index: 50;
    will-change: transform;
  }

  /* Bông 1: Đỉnh trung tâm */
  .flower--1 {
    left: 50%;
    z-index: 50;
    transform: rotate(0deg);
    animation: moving-flower-1 4s linear infinite;
  }
  .flower--1 .flower__line {
    height: 65vmin;
    animation-delay: 0.3s;
  }
  .flower--1 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 1.6s backwards; }
  .flower--1 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 1.4s backwards; }
  .flower--1 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 1.2s backwards; }
  .flower--1 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1s backwards; }

  /* Bông 2: Tầng trước ôm giữa phải */
  .flower--2 {
    left: 52%;
    z-index: 55;
    transform: rotate(8deg);
    animation: moving-flower-2 4s linear infinite;
  }
  .flower--2 .flower__line {
    height: 50vmin;
    animation-delay: 0.6s;
  }
  .flower--2 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 1.9s backwards; }
  .flower--2 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 1.7s backwards; }
  .flower--2 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 1.5s backwards; }
  .flower--2 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1.3s backwards; }

  /* Bông 3: Tầng trước ôm giữa trái */
  .flower--3 {
    left: 48%;
    z-index: 55;
    transform: rotate(-8deg);
    animation: moving-flower-3 4s linear infinite;
  }
  .flower--3 .flower__line {
    height: 50vmin;
    animation-delay: 0.9s;
  }
  .flower--3 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.5s backwards; }
  .flower--3 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.3s backwards; }
  .flower--3 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.1s backwards; }
  .flower--3 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1.9s backwards; }

  /* Bông 4: Vương miện cao bên trái */
  .flower--4 {
    left: 46%;
    z-index: 20;
    transform: rotate(-12deg);
    animation: moving-flower-4 3.5s linear infinite;
  }
  .flower--4 .flower__line {
    height: 70vmin;
    animation-delay: 1.2s;
  }
  .flower--4 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.8s backwards; }
  .flower--4 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.6s backwards; }
  .flower--4 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.4s backwards; }
  .flower--4 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 2.2s backwards; }

  /* Bông 5: Vương miện cao bên phải */
  .flower--5 {
    left: 54%;
    z-index: 20;
    transform: rotate(12deg);
    animation: moving-flower-5 4.5s linear infinite;
  }
  .flower--5 .flower__line {
    height: 70vmin;
    animation-delay: 1.9s;
  }
  .flower--5 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.7s backwards; }
  .flower--5 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.5s backwards; }
  .flower--5 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.3s backwards; }
  .flower--5 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 2.1s backwards; }

  /* Bông 6: Tầng dưới giữa trái */
  .flower--6 {
    left: 44%;
    z-index: 45;
    transform: rotate(-18deg);
    animation: moving-flower-6 3.8s linear infinite;
  }
  .flower--6 .flower__line {
    height: 43vmin;
    animation-delay: 1.1s;
  }

  /* Bông 7: Tầng dưới giữa phải */
  .flower--7 {
    left: 56%;
    z-index: 45;
    transform: rotate(18deg);
    animation: moving-flower-7 3.8s linear infinite;
  }
  .flower--7 .flower__line {
    height: 43vmin;
    animation-delay: 1.1s;
  }

  /* Bông 8: Tầng dưới ngoài trái */
  .flower--8 {
    left: 40%;
    z-index: 40;
    transform: rotate(-34deg);
    animation: moving-flower-8 4.2s linear infinite;
  }
  .flower--8 .flower__line {
    height: 40vmin;
    animation-delay: 1.4s;
  }

  /* Bông 9: Tầng dưới ngoài phải */
  .flower--9 {
    left: 60%;
    z-index: 40;
    transform: rotate(34deg);
    animation: moving-flower-9 4.2s linear infinite;
  }
  .flower--9 .flower__line {
    height: 40vmin;
    animation-delay: 1.4s;
  }

  /* Bông 10: Vai trên trái */
  .flower--10 {
    left: 42%;
    z-index: 35;
    transform: rotate(-24deg);
    animation: moving-flower-10 4s linear infinite;
  }
  .flower--10 .flower__line {
    height: 58vmin;
    animation-delay: 1.3s;
  }

  /* Bông 11: Vai trên phải */
  .flower--11 {
    left: 58%;
    z-index: 35;
    transform: rotate(24deg);
    animation: moving-flower-11 4.2s linear infinite;
  }
  .flower--11 .flower__line {
    height: 58vmin;
    animation-delay: 1.5s;
  }

  /* ============================================================
     🎨 PHỐI ĐỘ ĐẬM NHẠT TỰ NHIÊN GIỮA CÁC BÔNG HOA TRONG BÓ
     (Tạo độ sâu 3D, lớp trước sáng rạng rỡ, lớp sau thẫm ấm)
     ============================================================ */
  .flower--1 {
    /* Bông trung tâm chính: cân đối, rạng rỡ */
    filter: drop-shadow(0 0 1.2vmin var(--fl-glow, rgba(255, 179, 222, 0.4)));
  }
  .flower--2,
  .flower--3 {
    /* Tầng trên 2 bên: đón sáng nhiều hơn, hồng sáng tươi */
    filter: brightness(1.08) saturate(0.96) drop-shadow(0 0 0.8vmin var(--fl-glow, rgba(255, 179, 222, 0.3)));
  }
  .flower--4,
  .flower--5 {
    /* Tầng giữa: hồng phấn đằm thắm */
    filter: brightness(1.02) saturate(1.02);
  }
  .flower--6 {
    /* Đỉnh sau: sáng nhẹ vươn cao */
    filter: brightness(1.06) saturate(0.98);
  }
  .flower--7 {
    /* Lớp sau: hơi thẫm tạo độ sâu */
    filter: brightness(0.92) contrast(1.05) saturate(1.05);
  }
  .flower--8,
  .flower--9 {
    /* Tầng đáy 2 bên: tone hồng thẫm đậm đà làm nền nâng đỡ cả bó */
    filter: brightness(0.89) contrast(1.08) saturate(1.08);
  }
  .flower--10,
  .flower--11 {
    /* Vai trên: cánh đón nắng mai, hồng nhạt thanh tao */
    filter: brightness(1.07) saturate(0.94);
  }

  .flower__leafs {
    position: relative;
    animation: blooming-flower 3.5s backwards;
    will-change: transform;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
  }

  .flower__leafs--1 { animation-delay: 1.1s; }
  .flower__leafs--2 { animation-delay: 1.3s; }
  .flower__leafs--3 { animation-delay: 1.3s; }
  .flower__leafs--4 { animation-delay: 1.5s; }
  .flower__leafs--5 { animation-delay: 1.5s; }
  .flower__leafs--6 { animation-delay: 1.7s; }
  .flower__leafs--7 { animation-delay: 1.7s; }
  .flower__leafs--8 { animation-delay: 1.9s; }
  .flower__leafs--9 { animation-delay: 1.9s; }
  .flower__leafs--10 { animation-delay: 2.1s; }
  .flower__leafs--11 { animation-delay: 2.1s; }

  .flower__leafs::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -100%) translateZ(0);
    width: 8vmin;
    height: 8vmin;
    background-color: #ffdd00;
    border-radius: 50%;
    /* Blur tĩnh — không animate filter, chỉ animate opacity.
       opacity:0 → browser bỏ qua hoàn toàn việc render blur → không lag iOS */
    filter: blur(4vmin);
    opacity: 0;
    animation: glow-appear 1s ease-out 5.5s forwards;
    will-change: opacity;
  }

  @keyframes glow-appear {
    to { opacity: 0.55; }
  }

  /* --- PÉTALOS DE TULIPÁN (MEJORADOS - THEME TÙY BIẾN) --- */
  .flower__leaf {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 9vmin;
    height: 15vmin;
    background: var(--fl-leaf-outer-bg, radial-gradient(circle at 50% 20%, #ffe0f0 0%, #ff8fcf 30%, #e75480 60%, #c2185b 80%, #880e4f 100%));
    border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
    transform-origin: bottom center;
    opacity: 0.97;
    z-index: 2;
    border: 1.5px solid var(--fl-leaf-border, #c2185b);
    /* box-shadow đơn giản hơn để giảm tải GPU trên iOS */
    box-shadow: var(--fl-leaf-shadow, 0 0 1vmin rgba(255, 179, 222, 0.6));
    will-change: transform;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
  }

  /* Pétalos externos */
  .flower__leaf--1 { transform: translate(-50%, -5%) rotate(-22deg); z-index: 1; }
  .flower__leaf--2 { transform: translate(-50%, -5%) rotate(22deg);  z-index: 1; }
  .flower__leaf--3 { transform: translate(-50%, -10%) rotate(0deg);  z-index: 2; }

  /* Pétalos internos (más pequeños, para dar volumen) */
  .flower__leaf--4,
  .flower__leaf--5,
  .flower__leaf--6 {
    width: 7vmin;
    height: 12vmin;
    background: var(--fl-leaf-inner-bg, radial-gradient(circle at 50% 20%, #fff0fa 0%, #ffb3de 30%, #ff8fcf 55%, #e75480 80%, #c2185b 100%));
    opacity: 0.96;
    border: 1px solid var(--fl-leaf-border, #c2185b);
    border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
    box-shadow: var(--fl-leaf-inner-shadow, 0 0 0.6vmin rgba(255, 179, 222, 0.5));
    z-index: 3;
  }

  .flower__leaf--4 { transform: translate(-50%, -8%) rotate(-10deg); }
  .flower__leaf--5 { transform: translate(-50%, -8%) rotate(10deg); }
  .flower__leaf--6 { transform: translate(-50%, -12%) rotate(0deg); }

  /* Centro del tulipán */
  .flower__center {
    position: absolute;
    left: -2vmin;
    top: -2vmin;
    width: 4vmin;
    height: 4vmin;
    border-radius: 50%;
    background:
      var(--fl-center-bg, radial-gradient(circle at 30% 30%, #e0b3ff 0%, #a259e6 80%, #4b0066 100%));
    border: 2px solid var(--fl-center-border, #a259e6);
    box-shadow: var(--fl-center-shadow, 0 0 0.8vmin rgba(224, 179, 255, 0.6));
    will-change: transform;
    transform: translateZ(0);
  }

  .flower__line {
    height: 48vmin;
    width: 2vmin;
    background-image: linear-gradient(
        to left,
        rgb(0, 0, 0, 0.3),
        transparent,
        rgba(255, 255, 255, 0.2)
      ),
      linear-gradient(to top, transparent 10%, #2d5016, #4a7c23, #6b8e23);
    box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.7);
    animation: grow-flower-tree 6s backwards;
    will-change: height;
    transform: translateZ(0);
  }

  .flower__line__leaf {
    --w: 6.4vmin;
    --h: calc(var(--w) + 3.4vmin);
    position: absolute;
    top: 20%;
    left: 90%;
    width: var(--w);
    height: var(--h);
    border-top-right-radius: var(--h);
    border-bottom-left-radius: var(--h);
    background-image: linear-gradient(
      to top,
      rgba(45, 80, 22, 0.6),
      #4a7c23,
      #6b8e23
    );
    will-change: transform;
    transform: translateZ(0);
  }

  .flower__line__leaf--1 {
    transform: rotate(70deg) translateZ(0);
  }

  .flower__line__leaf--2 {
    top: 45%;
    transform: rotate(70deg) translateZ(0);
  }

  .flower__line__leaf--3,
  .flower__line__leaf--4 {
    border-top-right-radius: 0;
    border-bottom-left-radius: 0;
    border-top-left-radius: var(--h);
    border-bottom-right-radius: var(--h);
    left: -460%;
    top: 12%;
    transform: rotate(-70deg) translateZ(0);
  }

  .flower__line__leaf--4 {
    top: 40%;
  }

  /* Tỉa nhẹ các lá trùng lặp ở cành giữa để vừa đầy đặn vừa không bị rối */
  .flower--1 .flower__line__leaf--4,
  .flower--2 .flower__line__leaf--3,
  .flower--3 .flower__line__leaf--1,
  .flower--4 .flower__line__leaf--2 {
    display: none !important;
  }

  .flower__light {
    position: absolute;
    bottom: 0vmin;
    width: 0.8vmin;
    height: 0.8vmin;
    background-color: #fff;
    border-radius: 50%;
    animation: tulip-light 6s linear infinite backwards;
    box-shadow: 0 0 0.6vmin rgba(255, 255, 255, 0.7);
    will-change: transform, opacity;
    transform: translateZ(0);
  }

  .flower__light:nth-child(odd) {
    background-color: #fff;
  }

  .flower__light--1 { left: -2vmin; animation-delay: 1s; }
  .flower__light--2 { left: 3vmin; animation-delay: 0.5s; }
  .flower__light--3 { left: -6vmin; animation-delay: 0.3s; }
  .flower__light--4 { left: 6vmin; animation-delay: 0.9s; }
  .flower__light--5 { left: -1vmin; animation-delay: 1.5s; }
  .flower__light--6 { left: -4vmin; animation-delay: 3s; }
  .flower__light--7 { left: 3vmin; animation-delay: 2s; }
  .flower__light--8 { left: -6vmin; animation-delay: 3.5s; }

  .flower__grass {
    --c: #4a7c23;
    --line-w: 2vmin;
    position: absolute;
    bottom: 12vmin;
    left: -7vmin;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    z-index: 20;
    transform-origin: bottom center;
    transform: rotate(-48deg) rotateY(40deg);
  }

  .flower__grass--1 {
    animation: moving-grass 2s linear infinite;
  }

  .flower__grass--2 {
    left: 2vmin;
    bottom: 10vmin;
    transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
    opacity: 0.8;
    z-index: 0;
    animation: moving-grass--2 1.5s linear infinite;
  }

  .flower__grass--3 {
    left: -25vmin;
    bottom: 8vmin;
    transform: scale(0.7) rotate(-30deg) rotateY(45deg);
    opacity: 0.9;
    z-index: 15;
    animation: moving-grass--3 2.2s linear infinite;
  }

  .flower__grass--4 {
    left: -35vmin;
    bottom: 15vmin;
    transform: scale(0.4) rotate(60deg) rotateX(15deg) rotateY(-180deg);
    opacity: 0.7;
    z-index: 5;
    animation: moving-grass--4 1.8s linear infinite;
  }

  .flower__grass--5 {
    left: -18vmin;
    bottom: 6vmin;
    transform: scale(0.6) rotate(-60deg) rotateY(60deg);
    opacity: 0.85;
    z-index: 12;
    animation: moving-grass--5 2.5s linear infinite;
  }

  .flower__grass--6 {
    left: 25vmin;
    bottom: 9vmin;
    transform: scale(0.65) rotate(35deg) rotateY(-45deg);
    opacity: 0.9;
    z-index: 15;
    animation: moving-grass--6 2.3s linear infinite;
  }

  .flower__grass--7 {
    left: 35vmin;
    bottom: 14vmin;
    transform: scale(0.45) rotate(-70deg) rotateX(20deg) rotateY(170deg);
    opacity: 0.75;
    z-index: 8;
    animation: moving-grass--7 1.9s linear infinite;
  }

  .flower__grass--8 {
    left: 18vmin;
    bottom: 5vmin;
    transform: scale(0.55) rotate(50deg) rotateY(-70deg);
    opacity: 0.8;
    z-index: 10;
    animation: moving-grass--8 2.1s linear infinite;
  }

  .flower__grass--9 {
    left: -45vmin;
    bottom: 20vmin;
    transform: scale(0.3) rotate(20deg) rotateY(90deg);
    opacity: 0.6;
    z-index: 2;
    animation: moving-grass--9 1.6s linear infinite;
  }

  .flower__grass--10 {
    left: 42vmin;
    bottom: 18vmin;
    transform: scale(0.35) rotate(-45deg) rotateY(-120deg);
    opacity: 0.65;
    z-index: 3;
    animation: moving-grass--10 2.0s linear infinite;
  }

  .flower__grass--top {
    width: 7vmin;
    height: 10vmin;
    border-top-right-radius: 100%;
    border-right: var(--line-w) solid var(--c);
    transform-origin: bottom center;
    transform: rotate(-2deg);
  }

  .flower__grass--bottom {

  /* CSS cho lá thư */
  .letter {
    position: fixed;
    bottom: 24vmin;
    left: 50%;
    transform: translateX(-50%);
    width: 128px;
    height: 75px;
    z-index: 1000;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1.2s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
    filter: none;
  }

  .letter--visible {
    opacity: 1;
    pointer-events: auto;
  }

  .letter-envelope {
    position: relative;
    width: 100%;
    height: 100%;
    background: transparent;
    border-radius: 8px;
    perspective: 1000px;
    transform-style: preserve-3d;
    transition: transform 0.25s ease, opacity 0.5s ease;
  }

  .letter:hover .letter-envelope {
    transform: scale(1.06);
  }

  /* Thân phong bì có viền lượn nhẹ bằng filter (không dính vào nắp) */
  .letter-envelope::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #fff9e6 0%, #ffe6cc 50%, #ffd9b3 100%);
    border-radius: 8px;
    box-shadow:
      0 0 0 2px var(--letter-border-color, #f472b6),
      0 4px 8px rgba(0, 0, 0, 0.25),
      0 0 10px rgba(255, 215, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
    filter: url(#wavyBorderEnvelope);
    z-index: 0;
    pointer-events: none;
    -webkit-transform: translate3d(0, 0, 0);
    transform: translate3d(0, 0, 0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform;
    isolation: isolate;
    contain: paint;
    transition: box-shadow 0.25s ease;
  }

  .letter:hover .letter-envelope::before {
    box-shadow:
      0 0 0 2.5px var(--letter-border-color, #f472b6),
      0 6px 14px rgba(0, 0, 0, 0.3),
      0 0 16px var(--letter-border-glow, rgba(255, 107, 157, 0.5)),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  /* Nắp thư tam giác ngược SVG - viền sắc nét 100% (không dính filter sóng) */
  .letter-flap-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    overflow: visible;
    border-radius: 8px 8px 0 0;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.2));
    transform-origin: top center;
    transition: transform 0.4s ease-out;
  }

  .letter-flap-polyline {
    fill: none;
    stroke: var(--letter-border-color, #f472b6);
    stroke-width: 2.5px;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke-width 0.25s ease, stroke 0.3s ease;
  }

  .letter:hover .letter-flap-polyline {
    stroke-width: 3px;
  }

  /* 1. Nắp thư bật mở dứt khoát, phong bì nhạt dần */
  .letter.is-opening .letter-envelope {
    opacity: 0;
    transition: opacity 0.5s ease 0.25s;
    overflow: visible;
  }

  .letter.is-opening .letter-flap-svg {
    transform: rotateX(180deg);
  }

  .letter-seal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    background: radial-gradient(circle, var(--letter-seal-bg1, #ff6b9d) 0%, var(--letter-seal-bg2, #c2185b) 100%);
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow:
      0 0 15px var(--letter-seal-glow, rgba(255, 107, 157, 0.85)),
      0 0 25px var(--letter-seal-glow, rgba(255, 107, 157, 0.65)),
      0 0 35px var(--letter-seal-glow, rgba(255, 107, 157, 0.45)),
      inset 0 0 6px rgba(255, 255, 255, 0.3);
    z-index: 3;
    will-change: transform, opacity;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
  }

  .letter:hover .letter-seal {
    transform: translate(-50%, -50%) scale(1.12);
    box-shadow:
      0 0 20px var(--letter-seal-glow, rgba(255, 107, 157, 1)),
      0 0 35px var(--letter-seal-glow, rgba(255, 107, 157, 0.8)),
      inset 0 0 6px rgba(255, 255, 255, 0.4);
  }

  .letter-seal::after {
    content: '❤️';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 15px;
    line-height: 1;
  }

  /* 2. Trái tim bay lên chính giữa màn hình rồi BÙM! */
  .letter.is-opening .letter-seal {
    animation: heartFlyAndBoom 0.85s cubic-bezier(0.25, 0.1, 0.25, 1) 0.15s both;
    pointer-events: none;
    z-index: 1001;
  }

  @keyframes heartFlyAndBoom {
    0% {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    /* Bay lên tới chính giữa màn hình theo chiều height */
    65% {
      transform: translate(-50%, calc(-50% + var(--heart-fly-y, -240px))) scale(1.5);
      opacity: 1;
    }
    /* Khựng lại 1 nhịp ngắn tại tâm màn hình */
    75% {
      transform: translate(-50%, calc(-50% + var(--heart-fly-y, -240px))) scale(1.4);
      opacity: 1;
    }
    /* BÙM! Nổ bung nhẹ nhàng ngay tại tâm màn hình */
    88% {
      transform: translate(-50%, calc(-50% + var(--heart-fly-y, -240px))) scale(2.8);
      opacity: 0.85;
    }
    100% {
      transform: translate(-50%, calc(-50% + var(--heart-fly-y, -240px))) scale(3.8);
      opacity: 0;
    }
  }

  /* 3. Modal lá thư: Bùum! Bật nảy xuất hiện ngay tại tâm */
  .letter-modal {
    --lm-space-top: max(24px, env(safe-area-inset-top, 0px));
    --lm-space-bottom: max(20px, env(safe-area-inset-bottom, 0px));
    position: fixed;
    inset: 0;
    bottom: auto;
    height: var(--intro-view-h, var(--app-h));
    z-index: 1000;
    display: flex;
    align-items: flex-start; /* vị trí dọc do --lm-offset (JS) điều khiển để trượt mượt */
    justify-content: center;
    padding: var(--lm-space-top) max(20px, env(safe-area-inset-right, 0px)) var(--lm-space-bottom) max(20px, env(safe-area-inset-left, 0px));
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }

  .letter-modal.is-open {
    opacity: 1;
    visibility: visible;
  }

  .letter-modal__backdrop {
    position: absolute;
    inset: 0;
    background: rgba(8, 12, 28, 0.18);


  }

  .letter-modal__box-wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    flex-shrink: 0;

        let disposed = false;
        return {
          timeout(fn, delay) {
            if (disposed) return;
            const id = setTimeout(() => { timeouts.delete(id); fn(); }, delay);
            timeouts.add(id); return id;
          },
          interval(fn, delay) {
            if (disposed) return;
            const id = setInterval(fn, delay); intervals.add(id); return id;
          },
          frame(fn) {
            if (disposed) return;
            const id = requestAnimationFrame(t => { frames.delete(id); fn(t); });
            frames.add(id); return id;
          },
          clear() {
            timeouts.forEach(clearTimeout); intervals.forEach(clearInterval); frames.forEach(cancelAnimationFrame);
            timeouts.clear(); intervals.clear(); frames.clear();
          },
          dispose() { this.clear(); disposed = true; }
        };
      }

          if (glow) glow.style.opacity = '0';

            if (!overlay) return;

            // Nếu đã unlock audio rồi thì không hiển thị lại overlay

                if (!window.introOpening) overlay.classList.add('hidden');
                return;

            if (isLandscape()) {
                // Nếu đã xoay ngang, hiển thị overlay
                overlay.classList.remove('hidden');

                        } else if (element.mozRequestFullScreen) {

            }

            try {
                const SERVER_URL = 'https://api.giftory.pro';

                const response = await fetch(apiUrl, { cache: 'no-store' });

                    wash.style.cssText = 'position:absolute;inset:0;z-index:18;pointer-events:none;background:radial-gradient(ellipse 27% 37% at 50% 50%,#fffafaf5 10%,#fff0f4b0 48%,#ffd9e940 76%,transparent 100%),radial-gradient(ellipse 18% 24% at 39% 39%,#fff8f9b0,transparent 100%),radial-gradient(ellipse 20% 27% at 62% 61%,#ffe1ee99,transparent 100%);';
                    surface.appendChild(wash);
                    const at = (x,y,angle) => 'translate('+x+'px,'+y+'px) translate(-50%,-50%) rotate('+angle+'deg)';
                    const wipeDuration = 3000;
                    // Uneven diagonal strokes: the hand doubles back rather than sweeping horizontally.
                    const strokes = [
                        {offset:0,x:.22,y:.65,angle:-18,opacity:0},
                        {offset:.06,x:.26,y:.56,angle:-24,opacity:1},
                        {offset:.2,x:.43,y:.24,angle:-35,opacity:1},
                        {offset:.32,x:.32,y:.72,angle:20,opacity:1},
                        {offset:.46,x:.59,y:.29,angle:-28,opacity:1},
                        {offset:.58,x:.48,y:.77,angle:23,opacity:1},
                        {offset:.73,x:.75,y:.34,angle:-32,opacity:1},
                        {offset:.84,x:.63,y:.7,angle:18,opacity:1},
                        {offset:.94,x:.79,y:.3,angle:-24,opacity:1},
                        {offset:1,x:.74,y:.45,angle:-10,opacity:0}
                    ];
                    const strokeEasing = 'cubic-bezier(.35,0,.65,1)';
                    const wipeSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
                    wipeSvg.style.cssText='position:absolute;width:0;height:0;pointer-events:none;';
                    wipeSvg.setAttribute('aria-hidden','true');
                    wipeSvg.innerHTML='<defs><radialGradient id="board-wipe-feather"><stop offset="0" stop-color="black"/><stop offset=".48" stop-color="black"/><stop offset=".78" stop-color="black" stop-opacity=".65"/><stop offset="1" stop-color="black" stop-opacity="0"/></radialGradient><mask id="board-wipe-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" style="mask-type:luminance"><rect fill="white"/><g></g></mask></defs>';
                    layer.appendChild(wipeSvg);
                    const wipeMask=wipeSvg.querySelector('mask');
                    wipeMask.setAttribute('x','0'); wipeMask.setAttribute('y','0');
                    wipeMask.setAttribute('width',layer.clientWidth); wipeMask.setAttribute('height',layer.clientHeight);
                    const wipePaper=wipeMask.querySelector('rect');
                    wipePaper.setAttribute('width',layer.clientWidth); wipePaper.setAttribute('height',layer.clientHeight);
                    const trails=wipeMask.querySelector('g');
                    applySceneMask(wipeMask);
                    activateBouquetScene();
                    document.getElementById('bouquetScene').classList.add('scene-paused');
                    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                    // A narrow, three-band feather keeps the wipe from looking like ripples.
                    // Stroke progress shares the eraser's timing; no per-frame DOM measurements.
                    const trailPoints=strokes.map(point=>({x:board.left+board.width*point.x,y:board.top+board.height*point.y}));
                    const lengths=[0];
                    for(let i=1;i<trailPoints.length;i++) {
                        lengths.push(lengths[i-1]+Math.hypot(trailPoints[i].x-trailPoints[i-1].x,trailPoints[i].y-trailPoints[i-1].y));
                    }
                    const totalLength=lengths[lengths.length-1];
                    const trailPath=trailPoints.map((point,i)=>(i?'L':'M')+point.x+','+point.y).join(' ');
                    const trailWidth=Math.max(48,Math.min(board.width*.17,board.height*.3));
                    const trailBands=[{width:1.04,opacity:.12},{width:.94,opacity:.38},{width:.84,opacity:1}];
                    for(const band of trailBands) {
                        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
                        path.setAttribute('d',trailPath);
                        path.setAttribute('fill','none');
                        path.setAttribute('stroke','black');
                        path.setAttribute('stroke-linecap','round');
                        path.setAttribute('stroke-linejoin','round');
                        path.setAttribute('stroke-width',trailWidth*band.width);
                        path.setAttribute('opacity',band.opacity);
                        path.style.strokeDasharray=totalLength+' '+totalLength;
                        path.style.strokeDashoffset=String(totalLength);
                        trails.appendChild(path);
                        animate(path,strokes.map((point,index)=>({
                            offset:point.offset,easing:strokeEasing,
                            strokeDashoffset:String(totalLength-lengths[index]),
                            opacity:index===0?0:band.opacity
                        })),{duration:wipeDuration});
                    }
                    animate(tool,strokes.map(point => ({
                        offset:point.offset,opacity:point.opacity,easing:strokeEasing,
                        transform:at(board.left+board.width*point.x,board.top+board.height*point.y,point.angle)
                    })),{duration:wipeDuration});
                    await animate(wash,strokes.map(point => ({
                        offset:point.offset,opacity:point.opacity,easing:strokeEasing,
                        transform:'translate('+((point.x-.5)*100)+'%,'+((point.y-.5)*100)+'%) rotate('+(point.angle*.18)+'deg)'
                    })),{duration:wipeDuration});
                    tool.remove();
                    wash.remove();
                    // Keep the wiped areas open while the rest of the scene blooms away.
                    // Native SVG masking avoids pixel loops, PNG encoding and canvas uploads.
                    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
                    svg.setAttribute('aria-hidden','true');
                    svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;';
                    svg.innerHTML = `<defs>
                      <mask id="board-reveal-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" style="mask-type:luminance">
                        <rect fill="white"/>
                        <g id="board-reveal-bloom" transform="scale(0)"></g>
                      </mask>
                    </defs>`;
                    layer.appendChild(svg);
                    const mask = svg.querySelector('mask');
                    const paper = svg.querySelector('rect');
                    const bloom = svg.querySelector('#board-reveal-bloom');
                    mask.insertBefore(trails,bloom);
                    // A fixed wavy contour with translucent edges: no pixel sampling or animated filters.
                    const points = Array.from({length:64},(_,index) => {
                        const angle=index*Math.PI*2/64;
                        const r=1+.11*Math.sin(angle*3+.4)+.045*Math.sin(angle*5+1.6)+.012*Math.sin(angle*9+.2);
                        return {x:Math.cos(angle)*r,y:Math.sin(angle)*r};
                    });
                    const midpoint=(a,b) => ((a.x+b.x)/2).toFixed(4)+' '+((a.y+b.y)/2).toFixed(4);
                    let contour='M '+midpoint(points[points.length-1],points[0]);
                    points.forEach((point,index) => {
                        contour+=' Q '+point.x.toFixed(4)+' '+point.y.toFixed(4)+' '+midpoint(point,points[(index+1)%points.length]);
                    });
                    contour+=' Z';
                    let previousOpacity=0;
                    for (let step=0;step<4;step++) {
                        const fraction=(step+1)/4;
                        const opacity=fraction*fraction*(3-2*fraction);
                        const edge=document.createElementNS('http://www.w3.org/2000/svg','path');
                        edge.setAttribute('d',contour);
                        edge.setAttribute('transform','scale('+(1.02-step*.06/3)+')');
                        edge.setAttribute('fill','black');
                        edge.setAttribute('opacity',(opacity-previousOpacity)/(1-previousOpacity));
                        bloom.appendChild(edge);
                        previousOpacity=opacity;
                    }

                    let width, height, radius, cx, cy;
                    function resizeReveal() {
                        width = layer.clientWidth;
                        height = layer.clientHeight;
                        const rect = shadow.querySelector('.cute-board').getBoundingClientRect();
                        cx = rect.width ? rect.left+rect.width/2 : width/2;
                        cy = rect.height ? rect.top+rect.height/2 : height/2;
                        mask.setAttribute('x','0'); mask.setAttribute('y','0');
                        mask.setAttribute('width',width); mask.setAttribute('height',height);
                        paper.setAttribute('width',width); paper.setAttribute('height',height);
                        // The smallest contour radius, including its inner edge, is ~.80.
                        // Cover the corners with a small margin, avoiding an invisible tail.
                        radius = Math.hypot(Math.max(cx,width-cx),Math.max(cy,height-cy))/.79;
                    }
                    resizeReveal();
                    applySceneMask(mask);
                    // Continue from the already-wiped center instead of growing invisibly from zero.
                    const openingRadius = Math.min(board.width,board.height)*.14;
                    // A gentle, continuous spread after wiping, at constant radial speed.
                    const revealDuration = 1200;
                    await new Promise(resolve => {
                        const start = performance.now();
                        function reveal(now) {
                            if (width !== layer.clientWidth || height !== layer.clientHeight) resizeReveal();
                            // Linear progress: no acceleration, slowdown, or early cutoff.
                            // Animate only the mask transform, keeping the reveal lightweight.
                            const progress = Math.min(1,(now-start)/revealDuration);
                            const spread = openingRadius+(radius-openingRadius)*progress;
                            bloom.setAttribute('transform','translate('+cx+' '+cy+') rotate('+(-4+8*progress)+') scale('+spread+')');
                            // Remove the cover only after the reveal has reached its full extent.
                            if (progress < 1) frameId = requestAnimationFrame(reveal);
                            else resolve();
                        }
                        reveal(start);
                    });
                } else {
                    activateBouquetScene();
                    await animate(layer,[{opacity:1},{opacity:0}],{duration:240,easing:'ease-out'});
                }
            } catch (error) {
                console.error('Scene transition fallback:', error);
                if (document.body.dataset.scene !== 'bouquet') activateBouquetScene();
            } finally {
                cancelAnimationFrame(frameId);
                cancelAnimationFrame(maskFrameId);
                animations.forEach(animation => animation.cancel());
                layer.remove();
                document.getElementById('bouquetScene').classList.remove('scene-paused');
                button.removeAttribute('aria-busy');
                window.bouquetTransitionInProgress = false;
                startBouquetPlayback();
            }
        }
    </script>
